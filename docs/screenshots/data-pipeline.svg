  <rect x="80" y="610" width="1240" height="90" rx="16" fill="#172554"/>
  <text x="120" y="666" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="25">Output: a scored set of products that are not already in the partial cart, ranked for the next add-to-cart moment.</text>
