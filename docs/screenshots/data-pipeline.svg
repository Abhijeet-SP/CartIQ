<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#0f172a"/>
  <text x="80" y="95" fill="#f8fafc" font-family="Arial, sans-serif" font-size="46" font-weight="700">CartIQ data pipeline</text>
  <text x="80" y="138" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Repository walkthrough — source data to ranked product candidates</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="230" width="270" height="300" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="115" y="292" fill="#7dd3fc" font-size="27" font-weight="700">1. Raw Instacart data</text>
    <text x="115" y="345" fill="#e2e8f0" font-size="22">Orders &amp; timing</text>
    <text x="115" y="385" fill="#e2e8f0" font-size="22">Prior/train baskets</text>
    <text x="115" y="425" fill="#e2e8f0" font-size="22">Products &amp; departments</text>
    <text x="115" y="482" fill="#94a3b8" font-size="20">notebooks/preprocessing.ipynb</text>

    <path d="M375 380 H455" stroke="#38bdf8" stroke-width="6"/><path d="M440 365 L470 380 L440 395" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <rect x="485" y="230" width="340" height="300" rx="20" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
    <text x="520" y="292" fill="#c4b5fd" font-size="27" font-weight="700">2. Feature preparation</text>
    <text x="520" y="345" fill="#e2e8f0" font-size="22">User order features</text>
    <text x="520" y="385" fill="#e2e8f0" font-size="22">User-product history</text>
    <text x="520" y="425" fill="#e2e8f0" font-size="22">Cart-state candidates</text>
    <text x="520" y="482" fill="#94a3b8" font-size="20">notebooks/model_data_prep.ipynb</text>

    <path d="M850 380 H930" stroke="#a78bfa" stroke-width="6"/><path d="M915 365 L945 380 L915 395" fill="none" stroke="#a78bfa" stroke-width="6"/>
    <rect x="960" y="230" width="360" height="300" rx="20" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <text x="995" y="292" fill="#6ee7b7" font-size="27" font-weight="700">3. Ranker &amp; evaluation</text>
    <text x="995" y="345" fill="#e2e8f0" font-size="22">LightGBM binary classifier</text>
    <text x="995" y="385" fill="#e2e8f0" font-size="22">Order-level validation split</text>
    <text x="995" y="425" fill="#e2e8f0" font-size="22">Precision@10 / Recall@10</text>
    <text x="995" y="482" fill="#94a3b8" font-size="20">notebooks/model.ipynb</text>
